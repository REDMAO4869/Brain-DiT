# Paper configuration for Stage-1 raw diffusion pretraining (Schaefer-1000).
# Public-safe default: copy and edit paths before running.

seed: 42
device: auto
use_ddp: true
seq_len: 40
roi_dim: 1000
crop_mode: center
pad_mode: zeros
batch_size: 36  # per GPU
num_workers: 32

data:
  data_root: /path/to/Pretraining_OUTPUT
  atlas: s1000
  dataset_sampling: concat
  subject_col: Subject
  path_col: Path
  path_prefix: null
  strict_seq_len: true
  # NKI, ADHD, and PPMI are strictly held out for OOD evaluation.
  datasets:
    - HCP
    - CHCP
    - ABCD
    - PIOP1
    - PIOP2
    - ISYB
    - BHRC
    - SALD
    - SLIM
    - ABIDE
    - ADNI
    - HCP_task
    - CHCP_task
    - task_103
    - Forest
    - emo_film
    - NSD
    - Things
    - CineBrain
    - HCP_Movie
    - fMRI_sleeping
  splits:
    train: train
    val: val
    test: test

diffusion:
  num_steps: 1000
  schedule: cosine
  pred_type: v

dit:
  patch_size: 4
  d_model: 1024
  depth: 16
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  d_cond: 256
  pos_embed: sincos
  max_h: 256
  max_w: 256

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  amp: true

epochs: 150
log_every_n_steps: 10
save_every_n_epochs: 1
output_dir: outputs/stage1_s1000

condition:
  enable: true
  label_table: /path/to/labels/metadata.csv
  label_subject_col: Subject
  label_age_col: age
  label_gender_col: Gender
  label_dx_cols: [ADHD_DX, PPMI_DX, ABIDE_DX, ADNI_DX]
  cond_dim: 256
  cond_drop_prob: 0.1
  missing_label_policy: unconditional
  use_null_embedding: true
  tabular_dim: 0
  use_text_cond: false

losses:
  use_xspace_loss: false
  lambda_fc: 1.0
  lambda_fft: 1.0
  lambda_acf: 0.0
